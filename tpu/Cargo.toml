[package]
name = "svm-tpu"
version = "0.1.0"
edition = "2024"
publish = false
description = "Agave's QUIC transaction port for svmd"
license = "Apache-2.0"

# Its own workspace and lockfile, so the streamer never enters the engine's
# Cargo.lock or its digest.
[workspace]

[dependencies]
crossbeam-channel = "0.5.15"
log = "0.4.27"
solana-keypair = "3.1.2"
solana-streamer = { version = "=4.3.0", features = ["agave-unstable-api"] }
tokio-util = { version = "0.7.15", features = ["rt"] }

# The queue test drives the port with Agave's own streamer test client, as
# tools/quic-client does. Dev features stay out of the release binary.
[dev-dependencies]
quinn = "0.11.12"
solana-streamer = { version = "=4.3.0", features = ["agave-unstable-api", "dev-context-only-utils"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = "thin"
