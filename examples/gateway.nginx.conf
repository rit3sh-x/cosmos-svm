# A stateless reverse proxy for this chain's Solana RPC.
# The gateway is not part of consensus and holds no state of record.
# Agave's RPC supplies its own CORS headers, so the gateway adds none.
#
# The gateway listens on ports 8899 (JSON-RPC) and 8900 (WebSocket).
# Configure svmd to listen on loopback ports in app.toml under [svm]:
#
#   rpc-address = "127.0.0.1:18899"
#   ws-address = "127.0.0.1:18900"
#
# Local clients can continue using 127.0.0.1:8899.
#
# Install and reload:
#   install -m 644 examples/gateway.nginx.conf /etc/nginx/conf.d/gateway.conf
#   nginx -t && systemctl reload nginx

upstream svm_rpc { server 127.0.0.1:18899; }
upstream svm_ws  { server 127.0.0.1:18900; }

# Solana JSON-RPC
server {
    listen 8899;

    location / {
        proxy_pass http://svm_rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The devnet faucet limits each caller by this address. The gateway
        # sets it to the client's address and drops any value that the
        # client sent.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }
}

# Solana WebSocket subscriptions
server {
    listen 8900;

    location / {
        proxy_pass http://svm_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
