# Run the acceptance harnesses on demand, because they need more resources or
# dependencies than ci.yml. The consensus harness runs five svmd processes.
# The IBC harness builds simd from source. `make accept-rpc` and
# `make accept-devnet` also need the Solana CLI and @solana/web3.js. They are
# not here. `make release` runs them on a prepared machine.
name: acceptance

on:
  workflow_dispatch:
    inputs:
      harness:
        description: Which harness to run
        type: choice
        options: [consensus, ibc, retention, agreement]
        default: consensus
      runner:
        description: The consensus harness wants 16 GB of memory
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  accept:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Cache the flake's Nix store closure across runs.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # Add the pinned toolchain and dependencies to PATH.
      - name: Enter the flake's shell
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run acceptance tests
        run: make accept-${{ inputs.harness }}

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.harness }}-results
          path: rpc/accept/results/
          if-no-files-found: ignore
