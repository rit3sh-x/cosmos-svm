# Run lint and tests on every pull request and push to main.
# Nightly and resource-intensive harnesses run in separate workflows.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded pull request runs. Let every push to main finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Cache the flake's Nix store closure across runs.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # Add the CI shell's pinned tools to PATH: Go, Rust, make, the linters,
      # and Python. The acceptance tools stay out. Building them on a runner
      # filled its disk.
      - name: Enter the flake's CI shell
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
        with:
          arguments: .#ci

      - name: Report free disk
        run: df -h / | tail -1

      - name: Check shell scripts
        run: make lint-shell

      - name: Check Python syntax
        run: git ls-files -z '*.py' | xargs -0 python3 -m py_compile

      - name: Run the harness self-test
        run: rpc/accept/selftest.sh

      - name: Run the gate self-test
        run: python3 rpc/accept/gate_test.py

      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner ships about 25 GB of toolchains this job never uses. The
      # engine's release build, its tests, and the Rust tools filled the rest
      # of the disk. Report free space before and after.
      - name: Free the runner's disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Cache the flake's Nix store closure across runs.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # Add the CI shell's pinned tools to PATH, as in the lint job.
      - name: Enter the flake's CI shell
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
        with:
          arguments: .#ci

      - name: Report free disk
        run: df -h / | tail -1

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Keep the pinned programs and accounts until a manifest changes.
      # `make fetch-programs` checks every file against its pin and refetches
      # only the files that are missing or wrong.
      - name: Restore the pinned programs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            genesis/programs
            programs/*.so
            programs/*.account
          key: programs-${{ hashFiles('genesis/manifest.json', 'programs/manifest.json') }}

      # Build the engine before Go checks, which link it through cgo.
      - name: Build the engine
        run: make engine

      - name: Run gofmt and go vet
        run: make lint-go

      # Solana's public RPC answers GitHub runners with 403 Forbidden. Read
      # mainnet through the repository secret when it is set, else through
      # publicnode's keyless RPC. The pins fix the bytes, so the source does
      # not matter. Only the fetch command reads this variable.
      - name: Fetch the pinned programs
        run: make fetch-programs
        env:
          SVM_MAINNET_RPC: ${{ secrets.SVM_MAINNET_RPC || 'https://solana-rpc.publicnode.com' }}

      - name: Run make test
        run: make test

      - name: Report free disk at the end
        if: always()
        run: df -h / | tail -1
