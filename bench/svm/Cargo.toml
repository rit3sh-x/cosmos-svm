[package]
name = "svm-bench"
version = "0.1.0"
edition = "2021"
publish = false

# A separate workspace. See the exclude in the root Cargo.toml.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "svm-bench"
path = "src/main.rs"

# Criterion times execution. The binary reports the other measurements.
[[bench]]
name = "execution"
harness = false

[dependencies]
# Each version is pinned to the one the engine's Cargo.lock resolves, so this
# benchmark measures the code the engine links.
bincode = "=1.3.3"
solana-account = { version = "=4.5.0", features = ["dev-context-only-utils"] }
solana-bpf-loader-program = { version = "=4.3.0", features = ["agave-unstable-api"] }
solana-clock = "=3.2.0"
solana-compute-budget = { version = "=4.3.0", features = ["agave-unstable-api"] }
solana-compute-budget-program = { version = "=4.3.0", features = ["agave-unstable-api"] }
solana-epoch-schedule = "=3.3.0"
solana-fee-structure = "=4.1.0"
solana-hash = "=4.6.0"
solana-instruction = "=3.5.0"
solana-keypair = "3"
solana-loader-v3-interface = { version = "=7.0.0", features = ["bincode"] }
solana-message = "=4.5.0"
solana-program-runtime = { version = "=4.3.0", features = ["agave-unstable-api", "dev-context-only-utils"] }
solana-pubkey = "=3.0.0"
solana-rent = "=4.4.0"
solana-sdk-ids = "=3.1.0"
solana-signer = "3"
solana-svm = { version = "=4.3.0", features = ["agave-unstable-api", "dev-context-only-utils"] }
solana-svm-callback = "=4.3.0"
solana-svm-feature-set = "=4.3.0"
solana-svm-transaction = "=5.0.0"
solana-svm-type-overrides = "=4.3.0"
solana-syscalls = { version = "=4.3.0", features = ["agave-unstable-api"] }
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
solana-system-program = { version = "=4.3.0", features = ["agave-unstable-api"] }
solana-sysvar = "=4.2.0"
solana-sysvar-id = "=3.1.0"
# `SanitizedTransaction::from_transaction_for_tests` needs `blake3`.
# `dev-context-only-utils` would also pull in `verify` and `serde`, which the
# benchmark does not use.
solana-transaction = { version = "=4.2.0", features = ["blake3"] }
# The version Agave v4.3.0 uses. solana-transaction 4.2.0 and solana-signature
# 3.5.2 both use wincode 0.6.
solana-signature = "=3.5.2"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
